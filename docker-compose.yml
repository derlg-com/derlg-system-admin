services:
  derlg-redis:
    image: redis:7-alpine
    container_name: derlg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass derlg-redis-local-docker
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "derlg-redis-local-docker", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  derlg-minio:
    image: minio/minio:latest
    container_name: derlg-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: derlg-minio-local-docker
      MINIO_ROOT_PASSWORD: derlg-mini-local-docker
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  redis-data:
  minio-data:
